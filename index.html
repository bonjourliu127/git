<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NOCTURNE 台北夜生活現場。">
  <title>NOCTURNE | 台北夜生活</title>
  <style>
    :root { --bg:#111020; --text:#f7f0df; --pink:#ff4fa3; --muted:#bbb5c8; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Arial,"Noto Sans TC",sans-serif; }
    a { color:inherit; text-decoration:none; }
    .page { width:min(900px,calc(100% - 40px)); margin:auto; }
    header { display:flex; justify-content:space-between; align-items:center; padding:24px 0; }
    .logo { font-size:1.2rem; font-weight:bold; letter-spacing:.16em; }
    nav { display:flex; gap:20px; color:var(--muted); font-size:.9rem; }
    .hero { padding:110px 0 120px; }
    .label { color:var(--pink); font-size:.8rem; letter-spacing:.12em; }
    h1 { margin:18px 0; font-size:clamp(4rem,13vw,8rem); line-height:.9; letter-spacing:-.08em; }
    h1 span { color:var(--pink); }
    .intro { max-width:480px; color:var(--muted); line-height:1.8; }
    .events { padding:45px 0; border-top:1px solid #383347; }
    h2 { margin:0 0 24px; font-size:2rem; }
    .event-list { display:grid; gap:12px; }
    .event { display:flex; justify-content:space-between; align-items:center; padding:20px 0; border-bottom:1px solid #383347; }
    .event-date { color:var(--pink); font-size:.85rem; }
    .event h3 { margin:6px 0 0; font-size:1.35rem; }
    .event-info { color:var(--muted); font-size:.9rem; text-align:right; }
    footer { padding:40px 0 24px; color:var(--muted); font-size:.8rem; }
    @media (max-width:600px) { nav { gap:12px; font-size:.8rem; } .hero { padding:75px 0 90px; } .event { align-items:flex-start; gap:20px; } }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="logo" href="#top">NOCTURNE<span>.</span></a>
      <nav aria-label="主要導覽"><a href="#events">活動</a><a href="#contact">聯絡</a></nav>
    </header>

    <main id="top">
      <section class="hero">
        <p class="label">台北・信義區 / 00:00 — 06:00</p>
        <h1>Stay<br><span>Awake.</span></h1>
        <p class="intro">城市睡著以後，真正的故事才開始。音樂、燈光與不眠的夜晚，都在 NOCTURNE。</p>
      </section>

      <section class="events" id="events">
        <h2>本週活動</h2>
        <div class="event-list">
          <article class="event"><div><div class="event-date">09.18 / THU</div><h3>Neon Rituals</h3></div><div class="event-info">House · Disco<br>NT$ 800</div></article>
          <article class="event"><div><div class="event-date">09.19 / FRI</div><h3>After Dark</h3></div><div class="event-info">Techno · Live<br>NT$ 1,200</div></article>
          <article class="event"><div><div class="event-date">09.20 / SAT</div><h3>Nocturne Society</h3></div><div class="event-info">All night · Open<br>NT$ 1,000</div></article>
        </div>
      </section>
    </main>

    <footer id="contact">© 2026 NOCTURNE / TAIPEI ・ 信義區</footer>
  </div>
</body>
</html>
